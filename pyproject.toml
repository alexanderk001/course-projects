[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matmek4270-projects"
version = "1.0.0"
description = "Projects for MAT-MEK4270 course - Computational methods in mechanics"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "MATMEK-4270 Course"}
]
keywords = ["numerical-methods", "mechanics", "computational-mathematics", "finite-difference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "sympy",
    "scipy>=1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipython",
    "jupyter",
    "black",
    "isort",
]
test = [
    "pytest",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "ipython>=8.0",
    "jupyter>=1.0",
    "black>=23.0",
    "isort>=5.0",
    "ty>=0.0.64",
]

[project.urls]
Homepage = "https://www.uio.no/studier/emner/matnat/math/MAT-MEK4270/"
Repository = "https://github.com/MATMEK-4270/course-projects"

[tool.hatch.build.targets.wheel]
packages = ["projects", "cpyfromhere"]

[tool.pytest.ini_options]
testpaths = ["projects"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
